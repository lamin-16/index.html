<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alltagsdeutsch – Klingen wie ein Muttersprachler</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
body{font-family:Inter,system-ui,sans-serif}
.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;text-align:right}
.card{animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors">
<header class="sticky top-0 z-10 backdrop-blur bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800">
  <div class="max-w-3xl mx-auto px-4 py-3">
    <div class="flex items-center justify-between gap-3">
      <h1 class="text-lg font-extrabold">🇩🇪 Alltagsdeutsch <span class="ar text-sm font-normal text-slate-500 dark:text-slate-400">· الألمانية اليومية</span></h1>
      <button id="theme" class="px-3 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-800 text-sm" aria-label="Theme">🌙</button>
    </div>
    <input id="q" type="search" placeholder="Suchen… / ابحث…" class="mt-3 w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-4 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
    <div id="cats" class="mt-3 flex gap-2 overflow-x-auto pb-1"></div>
  </div>
</header>
<main class="max-w-3xl mx-auto px-4 py-6">
  <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Betonte Silbe = <b class="text-indigo-600 dark:text-indigo-400">GROSS</b>. 🔊 spricht den Ausdruck vor (Browser-Stimme, de-DE).</p>
  <div id="list" class="grid gap-4"></div>
  <p id="empty" class="hidden text-center text-slate-500 py-12">Nichts gefunden · لا نتائج</p>
  <button id="more" class="hidden mt-6 w-full py-3 rounded-xl bg-indigo-600 text-white font-semibold"></button>
</main>
<script>
const D=[
{c:'F',de:'eigentlich',st:'EI-gent-lich',ar:'في الواقع / أصلاً / بالمناسبة',why:'يُلطّف الأسئلة ويجعلها غير مباشرة، أو يشير إلى أن الواقع يختلف عمّا كان مخططاً.',ex:[['Was machst du eigentlich beruflich?','ماذا تعمل بالمناسبة؟'],['Eigentlich wollte ich schlafen, aber dann kam Jan.','كنت أنوي النوم أصلاً، لكن جاء يان.']]},
{c:'F',de:'halt',st:'HALT',ar:'ببساطة / هكذا هي الأمور',why:'تعبير عن تقبّل هادئ لأمر لا يمكن تغييره، بنبرة "ما باليد حيلة".',ex:[['Ich hab\'s vergessen. Das passiert halt.','نسيت. هذا يحدث ببساطة.'],['Es regnet halt. Dann bleiben wir zuhause.','إنها تمطر ببساطة، فنبقى في البيت.']]},
{c:'F',de:'eben',st:'E-ben',ar:'تحديداً / هذا هو الأمر',why:'مثل "halt" لكنه أكثر حزماً (شمال ألمانيا)، وقد يعني "بالضبط" عند التأكيد.',ex:[['Warum kommt er zu spät? – Er ist eben nie pünktlich.','لماذا تأخر؟ – إنه ببساطة لا يلتزم بالمواعيد.'],['Genau, eben!','بالضبط، هذا هو!']]},
{c:'F',de:'doch',st:'DOCH',ar:'بلى / أليس كذلك؟ / لكن',why:'يُستخدم لنفي النفي ("بلى")، أو لطلب التأكيد، أو لتذكير المحاور بشيء يعرفه.',ex:[['Du kommst doch heute Abend, oder?','ستأتي الليلة، أليس كذلك؟'],['Hast du keine Lust? – Doch!','ليس لديك رغبة؟ – بلى (لدي)!']]},
{c:'F',de:'mal',st:'MAL',ar:'قليلاً / لحظة (يخفف الطلب)',why:'يجعل الطلب أو الأمر ألطف وأخف، وبدونه تبدو الجملة آمرة أو جامدة.',ex:[['Kannst du mal kurz helfen?','هل تساعدني قليلاً؟'],['Schau mal, wer da ist!','انظر من هناك!']]},
{c:'F',de:'schon',st:'SCHON',ar:'بالفعل / سيحدث بالتأكيد (تطمين)',why:'للتطمين ("سيتحسن") أو للدلالة على أن شيئاً حدث أبكر من المتوقع.',ex:[['Das wird schon klappen.','سينجح الأمر، لا تقلق.'],['Bist du schon fertig?','هل انتهيت بالفعل؟']]},
{c:'F',de:'quasi',st:'QUA-si',ar:'تقريباً / كأنّ',why:'يُقرّب المعنى بدلاً من الدقة الكاملة، شائع جداً في الكلام السريع.',ex:[['Das ist quasi umsonst.','هذا تقريباً مجاني.'],['Wir sind quasi Nachbarn.','نحن تقريباً جيران.']]},
{c:'F',de:'bloß',st:'BLOOSS',ar:'فقط / إياك (تحذير) / ماذا عساي',why:'يضيف توتراً أو تحذيراً أو حيرة؛ نبرته عاطفية وتعتمد على سياق الجملة.',ex:[['Vergiss bloß den Schlüssel nicht!','إياك أن تنسى المفتاح!'],['Was soll ich bloß tun?','ماذا عساي أن أفعل؟']]},
{c:'F',de:'überhaupt',st:'Ü-ber-HAUPT',ar:'أصلاً / على الإطلاق',why:'يعزّز النفي، أو يسأل بنبرة استغراب عن أصل الأمر.',ex:[['Hast du überhaupt Zeit?','هل لديك وقت أصلاً؟'],['Das stimmt überhaupt nicht!','هذا غير صحيح إطلاقاً!']]},
{c:'F',de:'(ich) schätze',st:'ich SCHÄT-ze',ar:'أظن / أقدّر',why:'بديل غير رسمي لـ "ich glaube"، يُظهر تخميناً مبنياً على خبرة.',ex:[['Er kommt später, schätze ich.','سيأتي لاحقاً، أظن.'],['Das dauert ne Stunde, schätze ich.','سيستغرق ساعة تقريباً، أقدّر.']]},
{c:'F',de:'ja',st:'JA (خفيفة)',ar:'كما تعلم / طبعاً (تذكير)',why:'تذكّر المحاور بحقيقة يعرفها، أو تعبّر عن دهشة خفيفة. لا تعني "نعم" هنا.',ex:[['Ich hab ja gesagt, dass es regnet.','قلت لك إنها ستمطر كما تعلم.'],['Das ist ja toll!','هذا رائع فعلاً!']]},
{c:'F',de:'denn',st:'DENN',ar:'يا ترى / إذن',why:'يُضفي فضولاً ودّياً على السؤال ويخفف حدّته.',ex:[['Wie geht\'s dir denn?','كيف حالك يا ترى؟'],['Was ist denn los?','ما الأمر إذن؟']]},
{c:'F',de:'wohl',st:'WOHL',ar:'على الأغلب / ربما',why:'تخمين قوي، وأحياناً يحمل نبرة سخرية أو استنكار.',ex:[['Er ist wohl krank.','على الأغلب هو مريض.'],['Du spinnst wohl!','أظنك فقدت عقلك! (استنكار)']]},
{c:'F',de:'ruhig',st:'RU-hig',ar:'براحتك / لا تتردد',why:'تشجيع لطيف للمحاور على فعل شيء دون قلق.',ex:[['Frag ruhig, ich beiße nicht.','اسأل براحتك، لا أعض.'],['Du kannst ruhig länger bleiben.','يمكنك البقاء أكثر دون مشكلة.']]},
{c:'R',de:'Bock haben / Null Bock',st:'BOCK',ar:'لدي مزاج / لا مزاج لي إطلاقاً',why:'عامية شبابية جداً للتعبير عن الرغبة أو انعدامها. لا تستخدمها في عمل رسمي.',ex:[['Hast du Bock auf Kino? – Klar!','هل لديك مزاج للسينما؟ – طبعاً!'],['Ich hab null Bock auf Arbeit.','ليس لدي أي مزاج للعمل.']]},
{c:'R',de:'Krass!',st:'KRASS',ar:'جنوني! / رهيب! / صادم!',why:'ردّ فعل قوي على شيء مدهش أو سيئ أو مبالغ فيه؛ النبرة تحدد المعنى.',ex:[['Er hat 5000 Euro gewonnen. – Krass!','ربح 5000 يورو. – جنوني!'],['Das war echt krass heute.','كان اليوم قاسياً/مذهلاً حقاً.']]},
{c:'R',de:'Passt schon',st:'PASST schon',ar:'لا بأس / لا مشكلة / لا داعي',why:'ردّ مهذب وخفيف عند الاعتذار أو العرض، وبه تتجنب إحراج الآخر.',ex:[['Soll ich dir helfen? – Passt schon, danke.','هل أساعدك؟ – لا داعي، شكراً.'],['Sorry für die Verspätung! – Passt schon.','آسف على التأخير! – لا بأس.']]},
{c:'R',de:'Läuft bei dir',st:'LÄUFT bei dir',ar:'أمورك ممتازة (غالباً بسخرية)',why:'مجاملة صادقة أو تهكم حسب النبرة؛ شائعة بين الشباب.',ex:[['Neuer Job, neue Wohnung… läuft bei dir!','وظيفة جديدة وشقة جديدة… أمورك ممتازة!'],['Schon wieder die Bahn verpasst? Läuft bei dir.','فاتك القطار مجدداً؟ أمورك ممتازة (سخرية).']]},
{c:'R',de:'Sag bloß!',st:'SAG BLOOSS',ar:'لا تقل! / معقول؟',why:'تعبير عن دهشة (صادقة أو متصنَّعة) عند سماع خبر.',ex:[['Ich hab gekündigt. – Sag bloß!','استقلت. – لا تقل!'],['Sag bloß, du kennst ihn auch?','لا تقل إنك تعرفه أيضاً؟']]},
{c:'R',de:'Na und?',st:'NA und',ar:'وماذا إذن؟ / وما المشكلة؟',why:'ردّ لا مبالٍ أو دفاعي يقلّل من أهمية كلام الآخر. احذر نبرتك فقد تبدو وقحة.',ex:[['Ich bin zu spät. – Na und?','تأخرت. – وماذا إذن؟'],['Er mag mich nicht. Na und?','لا يحبني. وما المشكلة؟']]},
{c:'R',de:'Ach was!',st:'ACH was',ar:'أبداً! / ما هذا! / يا سلام!',why:'للنفي المطمئن ("لا تقلق")، أو بنبرة ساخرة عند سماع شيء بديهي.',ex:[['Hast du Angst? – Ach was!','أتخاف؟ – أبداً!'],['Es wird kalt. – Ach was, wirklich?','سيبرد الجو. – يا سلام، حقاً؟ (سخرية)']]},
{c:'R',de:'Na klar!',st:'na KLAR',ar:'طبعاً! / بكل تأكيد',why:'موافقة حماسية وودية، أقوى من "ja" وأكثر طبيعية.',ex:[['Kommst du mit? – Na klar!','هل تأتي معنا؟ – طبعاً!'],['Na klar helf ich dir.','طبعاً سأساعدك.']]},
{c:'R',de:'Echt?',st:'ECHT',ar:'حقاً؟ / فعلاً؟',why:'ردّ دهشة قصير جداً، ويأتي أيضاً بمعنى "حقاً" قبل الصفة.',ex:[['Ich zieh nach Hamburg. – Echt?','سأنتقل إلى هامبورغ. – حقاً؟'],['Das war echt gut.','كان جيداً حقاً.']]},
{c:'R',de:'Mir reicht\'s!',st:'mir REICHT\'S',ar:'طفح الكيل! / كفى!',why:'تعبير عن نفاد الصبر. قوي عاطفياً، ويُقال بغضب.',ex:[['Mir reicht\'s! Ich gehe.','طفح الكيل! سأذهب.'],['Jetzt reicht\'s aber!','كفى الآن!']]},
{c:'R',de:'Ich drück dir die Daumen',st:'ich DRÜCK dir die DAU-men',ar:'أتمنى لك التوفيق',why:'يقابل "بالتوفيق" لكن بصورة حرفية: "أضغط لك على الإبهام" كتعويذة حظ.',ex:[['Morgen ist die Prüfung. – Ich drück dir die Daumen!','غداً الامتحان. – أتمنى لك التوفيق!'],['Wir drücken euch die Daumen.','نتمنى لكم التوفيق.']]},
{c:'A',de:'sozusagen',st:'so-zu-SA-gen',ar:'إن صحّ التعبير / نوعاً ما',why:'تقدّم تشبيهاً أو وصفاً غير دقيق بالكامل، وتمنح كلامك ليونة.',ex:[['Er ist sozusagen mein zweiter Vater.','هو، إن صح التعبير، أبي الثاني.'],['Wir sind sozusagen schon da.','نحن عملياً وصلنا.']]},
{c:'A',de:'im Grunde genommen',st:'im GRUN-de ge-NOM-men',ar:'في الأساس / بشكل عام',why:'تلخّص الفكرة أو تبيّن أن الجوهر بسيط رغم التفاصيل.',ex:[['Im Grunde genommen ist es ganz einfach.','في الأساس الأمر بسيط جداً.'],['Im Grunde genommen hast du recht.','في العموم أنت محق.']]},
{c:'A',de:'Sag mal…',st:'SAG mal',ar:'قل لي… / يا هذا…',why:'تفتح سؤالاً بشكل ودّي، وقد تحمل استغراباً أو استنكاراً حسب النبرة.',ex:[['Sag mal, wo warst du gestern?','قل لي، أين كنت أمس؟'],['Sag mal, spinnst du?','يا هذا، هل جننت؟']]},
{c:'A',de:'weißt du',st:'WEISST du',ar:'أتعرف؟ / كما تعلم',why:'تُدخل المحاور في الحديث وتفصل بين الأفكار بشكل طبيعي.',ex:[['Weißt du, ich mag Berlin einfach.','أتعرف، أنا ببساطة أحب برلين.'],['Das ist schwer, weißt du?','هذا صعب، تعرف؟']]},
{c:'A',de:'also',st:'AL-so',ar:'إذن / حسناً',why:'تبدأ بها جملتك لتجمع أفكارك أو تنتقل لموضوع، وليست دائماً "therefore".',ex:[['Also, wie sieht\'s aus?','إذن، ما الوضع؟'],['Also gut, machen wir das.','حسناً، لنفعل ذلك.']]},
{c:'A',de:'na ja',st:'na JA',ar:'همم… / نوعاً ما',why:'تعبّر عن تردد أو رأي غير متحمّس دون قول "لا" صراحة.',ex:[['Schmeckt\'s? – Na ja…','هل الطعم جيد؟ – همم… نوعاً ما.'],['Na ja, kann man machen.','حسناً، لا بأس بذلك.']]},
{c:'A',de:'übrigens',st:'Ü-ber-ENS',ar:'بالمناسبة',why:'تُستخدم لإدخال معلومة جانبية أو تغيير الموضوع بلطف.',ex:[['Übrigens, Anna kommt auch.','بالمناسبة، آنا ستأتي أيضاً.'],['Übrigens, danke für gestern!','بالمناسبة، شكراً على أمس!']]},
{c:'P',de:'Hast du → haste',st:'HAS-te',ar:'"هل لديك" تُنطق "هاسته"',why:'اندماج الفعل مع الضمير في الكلام السريع. شائع جداً شفهياً، وليس في الكتابة الرسمية.',ex:[['Haste mal \'nen Euro?','هل معك يورو؟'],['Haste Zeit?','هل لديك وقت؟']]},
{c:'P',de:'ich habe → ich hab / \'ch hab',st:'ich HAB',ar:'تُحذف "e" الأخيرة وأحياناً "i"',why:'حذف حرف العلة في نهاية الكلمة هو القاعدة الأساسية للكلام الطبيعي.',ex:[['Ich hab keine Ahnung.','ليست لدي فكرة.'],['\'ch hab\'s dir doch gesagt!','قلت لك أليس كذلك!']]},
{c:'P',de:'nicht → nich · keine Ahnung → ka',st:'NICH · ka-AH-nung',ar:'"لا" تُختصر، و"لا فكرة" تصبح "كا"',why:'اختصار قوي في الكلام الودي السريع. "ka" تُسمع عند الشباب أكثر.',ex:[['Weiß ich nich.','لا أعرف.'],['Wo ist er? – Ka.','أين هو؟ – لا فكرة.']]},
{c:'P',de:'wir haben → wir ham',st:'wir HAM',ar:'تُنطق "فير هام"',why:'النهاية "-ben" تتحول إلى "m" في الكلام السريع.',ex:[['Wir ham Hunger.','نحن جائعون.'],['Was ham wir heute?','ماذا لدينا اليوم؟']]},
{c:'P',de:'so ein → so\'n',st:'SO\'n',ar:'تُنطق "زون"',why:'دمج "so" مع أداة النكرة في الكلام العفوي.',ex:[['Das ist so\'n Ding.','هذا شيء كذا.'],['So\'n Mist!','يا للسخافة!']]},
{c:'P',de:'eine → \'ne / \'nen',st:'NE / NEN',ar:'"eine" تُنطق "نه"، و"einen" تُنطق "نن"',why:'أداة التنكير تُختصر في الكلام العفوي.',ex:[['Ich brauch \'ne Pause.','أحتاج استراحة.'],['Gib mir \'nen Kaffee.','أعطني قهوة.']]},
{c:'P',de:'gehen → gehn',st:'GEHN',ar:'تُحذف "e" قبل النون',why:'الأفعال المنتهية بـ -en تفقد الـ e في الكلام السريع.',ex:[['Wir gehn ins Kino.','نذهب إلى السينما.'],['Gehn wir?','هل نذهب؟']]},
{c:'J',de:'Alter!',st:'AL-ter',ar:'يا رجل! / يا صاحبي!',why:'نداء بين الأصدقاء، ويعبّر عن دهشة أو غضب أو مودة حسب النبرة.',ex:[['Alter, das glaubst du nicht!','يا رجل، لن تصدق!'],['Alter, echt jetzt?','يا رجل، حقاً الآن؟']]},
{c:'J',de:'Digga',st:'DI-gga',ar:'يا صاحبي (هامبورغ والشباب)',why:'تحية ودية بين الشباب، وأصلها من شمال ألمانيا.',ex:[['Digga, wo bleibst du?','يا صاحبي، أين أنت؟'],['Digga, das war mega!','يا صاحبي، كان رائعاً!']]},
{c:'J',de:'safe',st:'SEIF',ar:'أكيد / بالتأكيد',why:'تعبير شبابي مأخوذ من الإنجليزية يعني "بالتأكيد".',ex:[['Kommst du? – Safe!','هل تأتي؟ – أكيد!'],['Das wird safe gut.','سيكون جيداً بالتأكيد.']]},
{c:'J',de:'geil',st:'GEIL',ar:'رائع! / خرافي!',why:'قوية وغير رسمية، تُقال بحماس. تجنّبها في العمل الرسمي.',ex:[['Das Konzert war geil!','الحفلة كانت رائعة!'],['Geile Jacke!','سترة رائعة!']]},
{c:'J',de:'cringe',st:'KRINDSCH',ar:'محرج / يبعث على الحرج',why:'تصف موقفاً مُحرجاً أو فيه تصنّع زائد، وهي من لغة الإنترنت.',ex:[['Das Video ist so cringe.','هذا الفيديو محرج جداً.'],['Cringe, oder?','محرج، أليس كذلك؟']]},
{c:'J',de:'voll',st:'VOLL',ar:'جداً (للتأكيد)',why:'تُستعمل كمعزّز قبل الصفة بدل "sehr" في الكلام اليومي.',ex:[['Das ist voll nett von dir.','هذا لطيف جداً منك.'],['Ich bin voll müde.','أنا متعب جداً.']]},
{c:'J',de:'Oha!',st:'O-ha',ar:'أوه! / يا إلهي!',why:'ردّ فعل سريع على مفاجأة أو أمر غير متوقع.',ex:[['Oha, das sieht teuer aus.','أوه، يبدو غالياً.'],['Oha, schon so spät?','أوه، الوقت متأخر هكذا؟']]},
{c:'J',de:'Hammer!',st:'HAM-mer',ar:'ممتاز! / خيالي!',why:'مدح قوي لشيء رائع. وتُقال أيضاً "das ist der Hammer".',ex:[['Neues Auto? Hammer!','سيارة جديدة؟ ممتاز!'],['Das Spiel war der Hammer.','المباراة كانت خيالية.']]},
{c:'S',de:'Moin',st:'MOIN',ar:'مرحباً (شمال ألمانيا، أي وقت)',why:'تحية قصيرة تُقال صباحاً وغيره في الشمال، ولا تعني "صباح الخير" فقط.',ex:[['Moin! Alles klar?','مرحباً! كل شيء بخير؟'],['Moin zusammen!','مرحباً للجميع!']]},
{c:'S',de:'Alles gut?',st:'AL-les GUT',ar:'كل شيء بخير؟ / كيف الحال؟',why:'تحية عفوية بين الأصدقاء، وجوابها المعتاد "ja, bei dir?".',ex:[['Hey, alles gut? – Ja, bei dir?','مرحباً، كل شيء بخير؟ – نعم، وأنت؟'],['Alles gut, danke.','كل شيء بخير، شكراً.']]},
{c:'S',de:'Muss ja',st:'MUSS ja',ar:'ماشي الحال / لا بأس',why:'جواب خفيف ساخر على "كيف حالك؟" بمعنى: لا أشتكي لأن لا خيار لي.',ex:[['Wie geht\'s? – Muss ja.','كيف حالك؟ – ماشي الحال.'],['Und bei dir? – Muss.','وأنت؟ – ماشي.']]},
{c:'S',de:'Kein Ding',st:'KEIN DING',ar:'لا مشكلة / عفواً',why:'جواب مريح على الشكر أو الاعتذار.',ex:[['Danke fürs Helfen! – Kein Ding.','شكراً للمساعدة! – لا مشكلة.'],['Kein Ding, mach ich.','لا مشكلة، سأفعله.']]},
{c:'S',de:'Ist mir wurscht',st:'ist mir WURSCHT',ar:'لا يهمني / سيان عندي',why:'أخف من "egal"، وفيها نبرة عامية جنوبية. قد تبدو قليلة اللباقة.',ex:[['Pizza oder Pasta? – Ist mir wurscht.','بيتزا أم معكرونة؟ – لا يهمني.'],['Mir doch egal!','لا يهمني!']]},
{c:'S',de:'Das kannst du knicken',st:'das kannst du KNI-cken',ar:'انسَ الأمر / لا فائدة منه',why:'تُقال لشيء عديم الجدوى أو رديء.',ex:[['Der Plan? Den kannst du knicken.','الخطة؟ انسَها.'],['Das Handy kannst du knicken.','هذا الهاتف انسَه.']]},
{c:'S',de:'Ich bin platt',st:'ich bin PLATT',ar:'أنا منهك',why:'تعبير عن تعب شديد، حرفياً "مسطّح".',ex:[['Nach der Arbeit bin ich platt.','بعد العمل أنا منهك.'],['Ich bin total platt.','أنا منهك تماماً.']]},
{c:'S',de:'Das ist nicht mein Ding',st:'das ist nicht mein DING',ar:'هذا ليس من اهتماماتي',why:'طريقة مهذبة لرفض شيء لا تحبه دون إساءة.',ex:[['Sport ist nicht mein Ding.','الرياضة ليست من اهتماماتي.'],['Horrorfilme sind nicht mein Ding.','أفلام الرعب ليست لي.']]},
{c:'S',de:'Schönen Feierabend',st:'SCHÖ-nen FEI-er-a-bend',ar:'نهاية يوم عمل سعيدة',why:'تُقال لزملاء العمل عند مغادرة العمل، وهي من صميم الثقافة الألمانية.',ex:[['Tschüss, schönen Feierabend!','إلى اللقاء، نهاية عمل سعيدة!'],['Danke, dir auch!','شكراً، وأنت أيضاً!']]},
{c:'S',de:'Mahlzeit',st:'MAHL-zeit',ar:'بالهناء (تحية وقت الغداء)',why:'تحية بين الزملاء في وقت الغداء، حتى لو لم يأكلوا.',ex:[['Mahlzeit! – Mahlzeit!','بالهناء! – بالهناء!'],['Mahlzeit, Kollegen!','بالهناء يا زملاء!']]},
{c:'S',de:'Auf keinen Fall',st:'auf KEI-nen FALL',ar:'مستحيل / بأي شكل',why:'رفض قاطع، وأقوى من "nein".',ex:[['Gehst du da hin? – Auf keinen Fall!','هل تذهب إلى هناك؟ – مستحيل!'],['Auf keinen Fall sag ich das.','لن أقول ذلك أبداً.']]},
{c:'S',de:'Gute Besserung',st:'GU-te BES-se-rung',ar:'الشفاء العاجل',why:'عبارة تُقال لمن يمرض، ويُنتظر منك قولها في العمل والمدرسة.',ex:[['Du bist krank? Gute Besserung!','أنت مريض؟ الشفاء العاجل!'],['Gute Besserung und ruh dich aus.','الشفاء العاجل واسترح.']]},
{c:'M',de:'Die Rechnung, bitte / Zahlen, bitte',st:'ZAH-len, BIT-te',ar:'الحساب من فضلك',why:'الطريقة الطبيعية لطلب الفاتورة في المطعم، و"Zahlen, bitte" أقصر وأكثر شيوعاً.',ex:[['Zahlen, bitte!','الحساب من فضلك!'],['Zusammen oder getrennt?','معاً أم كلٌّ على حدة؟']]},
{c:'M',de:'Stimmt so',st:'STIMMT so',ar:'احتفظ بالباقي (بقشيش)',why:'تقولها وأنت تدفع لتترك الباقي بقشيشاً، والعادة تقريب المبلغ بنحو 5–10٪.',ex:[['Das macht 18 Euro. – Stimmt so!','المبلغ 18 يورو. – احتفظ بالباقي!'],['Zwanzig, stimmt so.','عشرون، احتفظ بالباقي.']]},
{c:'M',de:'Ich hätte gern…',st:'ich HÄT-te GERN',ar:'أريد… (بأدب)',why:'أنعم من "Ich will" التي تبدو فظة، وهي الصيغة الأساسية للطلب.',ex:[['Ich hätte gern einen Kaffee.','أريد قهوة من فضلك.'],['Ich hätte gern das Schnitzel.','أريد الشنيتزل.']]},
{c:'M',de:'Zum Mitnehmen',st:'zum MIT-neh-men',ar:'للأخذ معي',why:'تُقال عند الطلب إذا لم تكن ستأكل في المكان.',ex:[['Hier essen oder zum Mitnehmen?','هنا أم للأخذ؟'],['Zum Mitnehmen, bitte.','للأخذ من فضلك.']]},
{c:'M',de:'Ich schau nur mal',st:'ich SCHAU nur MAL',ar:'أتفرج فقط',why:'ردّ مهذب على البائع حين لا تريد مساعدة الآن.',ex:[['Kann ich helfen? – Ich schau nur mal.','هل أساعدك؟ – أتفرج فقط.'],['Danke, ich schau mich nur um.','شكراً، أتفرج فقط.']]},
{c:'M',de:'Ist hier noch frei?',st:'ist hier noch FREI',ar:'هل هذا المقعد شاغر؟',why:'تُقال في المطاعم والقطارات قبل الجلوس إلى طاولة أو مقعد.',ex:[['Entschuldigung, ist hier noch frei?','عفواً، هل هذا شاغر؟'],['Ja, setz dich ruhig.','نعم، اجلس براحتك.']]},
{c:'W',de:'Was gibt\'s?',st:'WAS GIBT\'S',ar:'ما الأمر؟ / ماذا هناك؟',why:'تفتح بها حديثاً مع زميل أو صديق جاء إليك لسبب.',ex:[['Hast du kurz Zeit? – Klar, was gibt\'s?','هل لديك لحظة؟ – طبعاً، ما الأمر؟'],['Hi, was gibt\'s Neues?','مرحباً، ما الجديد؟']]},
{c:'W',de:'Ich melde mich',st:'ich MEL-de mich',ar:'سأتواصل معك',why:'وعد بالرد لاحقاً، شائع جداً في العمل وبين الأصدقاء.',ex:[['Ich melde mich bei dir.','سأتواصل معك.'],['Melde dich, wenn du da bist.','أخبرني عندما تصل.']]},
{c:'W',de:'Das passt mir gut',st:'das PASST mir GUT',ar:'هذا يناسبني',why:'للموافقة على موعد أو اقتراح. وللرفض: "Das passt mir leider nicht".',ex:[['Donnerstag, 15 Uhr? – Passt mir gut.','الخميس 15:00؟ – يناسبني.'],['Passt das für dich?','هل يناسبك ذلك؟']]},
{c:'W',de:'Schon erledigt',st:'schon er-LE-digt',ar:'تم الأمر',why:'طريقة مختصرة وواثقة لإخبار أن المهمة أُنجزت.',ex:[['Hast du die Mail geschickt? – Schon erledigt.','هل أرسلت البريد؟ – تم.'],['Ist schon erledigt.','تم الأمر.']]},
{c:'W',de:'Das sehe ich anders',st:'das SE-he ich AN-ders',ar:'لي رأي مختلف',why:'طريقة مهذبة للاعتراض دون صدام، أنعم من "Das ist falsch".',ex:[['Das sehe ich anders, ehrlich gesagt.','لي رأي مختلف بصراحة.'],['Ich seh das etwas anders.','أراه بشكل مختلف قليلاً.']]},
{c:'L',de:'Servus',st:'SER-vus',ar:'مرحباً / مع السلامة (بافاريا والنمسا)',why:'تُقال للتحية والوداع في الجنوب، وليست للشمال.',ex:[['Servus, wie geht\'s?','مرحباً، كيف الحال؟'],['Servus, bis morgen!','مع السلامة، إلى الغد!']]},
{c:'L',de:'Grüß Gott',st:'GRÜSS GOTT',ar:'تحية الجنوب (بافاريا)',why:'تحية محترمة في بافاريا والنمسا، ويُقال "Moin" في الشمال بدلها.',ex:[['Grüß Gott, Frau Müller.','تحياتي، سيدة مولر.'],['Grüß Gott! Ein Tisch für zwei?','تحياتي! طاولة لشخصين؟']]},
{c:'R',de:'Ich verstehe nur Bahnhof',st:'ich ver-STE-he nur BAHN-hof',ar:'لا أفهم شيئاً',why:'تعبير ساخر لمن لا يفهم الكلام، حرفياً: "أفهم محطة القطار فقط".',ex:[['Ich verstehe nur Bahnhof.','لا أفهم شيئاً.'],['Bei dem Thema versteh ich nur Bahnhof.','لا أفهم شيئاً في هذا الموضوع.']]},
{c:'R',de:'Das ist nicht mein Bier',st:'das ist nicht mein BIER',ar:'ليس شأني / لا علاقة لي',why:'تبتعد بها عن مسؤولية أو مشكلة لا تخصك.',ex:[['Das ist nicht mein Bier.','هذا ليس شأني.'],['Streit im Büro? Nicht mein Bier.','خلاف في المكتب؟ ليس شأني.']]},
{c:'R',de:'Ich hab die Schnauze voll',st:'ich hab die SCHNAU-ze VOLL',ar:'طفح بي الكيل / ضجرت',why:'عامية فظّة نوعاً ما، استعملها مع الأصدقاء فقط.',ex:[['Ich hab die Schnauze voll!','طفح بي الكيل!'],['Er hat die Schnauze voll vom Job.','ضجر من وظيفته.']]},
{c:'X',de:'Mir ist kalt (nicht: ich bin kalt)',st:'mir ist KALT',ar:'أشعر بالبرد',why:'خطأ شائع عند العرب. "Ich bin kalt" تعني أنك بارد المشاعر.',ex:[['Mir ist kalt. Hast du eine Jacke?','أشعر بالبرد. هل لديك سترة؟'],['Mir ist warm.','أشعر بالحرارة.']]},
{c:'X',de:'Ich bin satt (nicht: voll)',st:'ich bin SATT',ar:'شبعت',why:'تُستعمل "satt" للأكل، أما "voll" فتعني ممتلئاً أو في حالة سكر.',ex:[['Noch ein Stück? – Nein, ich bin satt.','قطعة أخرى؟ – لا، شبعت.'],['Danke, ich bin schon satt.','شكراً، شبعت بالفعل.']]},
{c:'X',de:'Wie bitte? (nicht: Was?)',st:'wie BIT-te',ar:'عفواً؟ (لم أسمع)',why:'"Was?" وحدها فظة. بين الأصدقاء يقال "Hä?" بنبرة خفيفة.',ex:[['Wie bitte? Kannst du das wiederholen?','عفواً؟ هل تكرر ذلك؟'],['Hä? Was hast du gesagt?','هاه؟ ماذا قلت؟']]},
{c:'X',de:'duzen / siezen',st:'DU-tsen / SIE-tsen',ar:'التخاطب بـ du أو Sie',why:'استعمل Sie مع الغرباء والرؤساء، وdu مع الأصدقاء والأطفال. المبادرة بـ du تبدأ عادة من الأكبر سناً.',ex:[['Wir können uns gern duzen.','يمكننا استخدام du بكل سرور.'],['Darf ich du sagen?','هل أستخدم du؟']]},
{c:'F',de:'ne? / oder? (Frageanhängsel)',st:'NE / O-der',ar:'أليس كذلك؟ (في نهاية الجملة)',why:'تطلب بها تأكيداً. "ne" شمالية، و"gell" جنوبية، و"oder" شائعة في كل مكان.',ex:[['Das ist schön, ne?','هذا جميل، أليس كذلك؟'],['Du kommst mit, oder?','ستأتي معنا، أليس كذلك؟']]},
{c:'F',de:'eh',st:'EH',ar:'أصلاً / على أي حال',why:'اختصار "ohnehin"، يعني أن الأمر كان سيحدث أو كان معروفاً على أي حال.',ex:[['Das wusste ich eh.','كنت أعرف ذلك أصلاً.'],['Komm, wir gehen eh schon.','هيا، نحن ذاهبون أصلاً.']]},
{c:'S',de:'Ich muss los',st:'ich MUSS LOS',ar:'يجب أن أذهب',why:'طريقة طبيعية لإنهاء المحادثة أو مغادرة المكان دون إحراج.',ex:[['Ich muss los, bis später!','يجب أن أذهب، أراك لاحقاً!'],['Sorry, ich muss los.','آسف، يجب أن أذهب.']]},
{c:'S',de:'Bis später / Bis dann',st:'bis SPÄ-ter / bis DANN',ar:'أراك لاحقاً',why:'وداع عفوي بين الأصدقاء والزملاء عندما تتوقع لقاءهم قريباً.',ex:[['Bis später, ich ruf dich an.','أراك لاحقاً، سأتصل بك.'],['Alles klar, bis dann!','حسناً، إلى اللقاء!']]},
{c:'S',de:'Mach\'s gut',st:'MACH\'S GUT',ar:'اعتنِ بنفسك / مع السلامة',why:'وداع ودّي، وغالباً يُقال لمن لن تراه قريباً.',ex:[['Mach\'s gut, wir sehen uns!','اعتنِ بنفسك، سنلتقي!'],['Du auch, mach\'s gut!','وأنت أيضاً، مع السلامة!']]},
{c:'S',de:'Lass uns…',st:'LASS UNS',ar:'لنفعل… / هيا بنا',why:'اقتراح عفوي ومهذب لفعل شيء معاً.',ex:[['Lass uns was essen gehen.','لنذهب لنأكل شيئاً.'],['Lass uns morgen telefonieren.','لنتحدث هاتفياً غداً.']]},
{c:'S',de:'Keine Ahnung',st:'KEI-ne AH-nung',ar:'لا فكرة لدي',why:'إجابة شائعة جداً، وأخف من "ich weiß es nicht".',ex:[['Wo ist Tom? – Keine Ahnung.','أين توم؟ – لا فكرة.'],['Keine Ahnung, was er will.','لا فكرة ماذا يريد.']]},
{c:'S',de:'Auf jeden Fall',st:'auf JE-den FALL',ar:'بالتأكيد / على أي حال',why:'موافقة حاسمة، وعكسها "auf keinen Fall".',ex:[['Kommst du? – Auf jeden Fall!','هل تأتي؟ – بالتأكيد!'],['Das probier ich auf jeden Fall aus.','سأجرب ذلك بالتأكيد.']]},
{c:'S',de:'Alles klar?',st:'AL-les KLAR',ar:'تمام؟ / مفهوم؟',why:'تسأل بها إن كان كل شيء على ما يرام، أو تؤكد بها الاتفاق.',ex:[['Alles klar? – Alles klar!','تمام؟ – تمام!'],['Alles klar, dann bis morgen.','حسناً، إذن إلى الغد.']]},
{c:'R',de:'Das ist mir peinlich',st:'das ist mir PEIN-lich',ar:'أشعر بالإحراج',why:'تعبير عن حرج شخصي، والصفة "peinlich" قد تصف الموقف أيضاً.',ex:[['Das ist mir echt peinlich.','أشعر بالإحراج حقاً.'],['Wie peinlich!','يا للإحراج!']]},
{c:'R',de:'Ich hab Kohldampf',st:'ich hab KOHL-dampf',ar:'أنا جائع جداً',why:'عامية قوية تعني جوعاً شديداً. وتُقال أيضاً "Ich hab Hunger".',ex:[['Ich hab Kohldampf, lass was essen.','أنا جائع جداً، لنأكل شيئاً.'],['Nach dem Sport hab ich Kohldampf.','بعد الرياضة أجوع جداً.']]},
{c:'R',de:'Schwein gehabt!',st:'SCHWEIN ge-HABT',ar:'يا لحظك! / كنت محظوظاً',why:'تعبير عن حظ سعيد وإفلات من موقف سيئ. الخنزير رمز الحظ في الثقافة الألمانية.',ex:[['Der Zug wartete noch. – Schwein gehabt!','القطار كان ينتظر. – يا لحظك!'],['Da hast du aber Schwein gehabt.','كنت محظوظاً حقاً.']]},
{c:'R',de:'Keine Panik',st:'KEI-ne PA-nik',ar:'لا تذعر / اهدأ',why:'تطمين ودّي عند التوتر. تُقال أحياناً بنبرة مازحة.',ex:[['Keine Panik, das schaffen wir.','لا تذعر، سننجح في ذلك.'],['Keine Panik, ist nur ein Kratzer.','اهدأ، مجرد خدش.']]},
{c:'R',de:'Du nervst',st:'du NERVST',ar:'أنت تزعجني',why:'عامية تقال بين الأصدقاء، وقد تكون جارحة مع الغرباء.',ex:[['Hör auf, du nervst!','توقف، أنت تزعجني!'],['Du nervst heute total.','أنت تزعجني اليوم تماماً.']]},
{c:'W',de:'Kurze Frage',st:'KUR-ze FRA-ge',ar:'سؤال سريع',why:'تفتتح بها سؤالاً لزميل دون إزعاجه، شائعة جداً في العمل.',ex:[['Kurze Frage: Hast du die Datei?','سؤال سريع: هل لديك الملف؟'],['Kurze Frage, hast du kurz Zeit?','سؤال سريع، هل لديك لحظة؟']]},
{c:'W',de:'Ich bin gleich bei dir',st:'ich bin GLEICH bei DIR',ar:'سأكون معك حالاً',why:'تطلب من الآخر الانتظار لحظة بلطف أثناء انشغالك.',ex:[['Ich bin gleich bei dir.','سأكون معك حالاً.'],['Moment, ich bin gleich da.','لحظة، سأكون هنا حالاً.']]},
{c:'W',de:'Das klappt',st:'das KLAPPT',ar:'سينجح الأمر / يتم',why:'تعبير عن نجاح أمر أو توافق موعد.',ex:[['Das klappt bestimmt.','سينجح بالتأكيد.'],['Hat alles geklappt?','هل سار كل شيء على ما يرام؟']]},
{c:'X',de:'Ich freue mich auf…',st:'ich FREU-e mich AUF',ar:'أتطلع إلى… (المستقبل)',why:'خطأ شائع مع "für". استعمل "auf" للمستقبل و"über" للحاضر.',ex:[['Ich freue mich auf das Wochenende.','أتطلع إلى عطلة نهاية الأسبوع.'],['Ich freu mich auf dich!','أتطلع للقائك!']]},
{c:'X',de:'Ich bin 25 Jahre alt',st:'ich bin 25 JAH-re alt',ar:'عمري 25 سنة',why:'تقول "أنا 25 سنة"، لا "لدي 25 سنة" كما في بعض اللغات.',ex:[['Wie alt bist du? – Ich bin 25.','كم عمرك؟ – عمري 25.'],['Er ist schon 30 Jahre alt.','عمره 30 سنة بالفعل.']]},
{c:'X',de:'Ich habe Hunger / Durst',st:'ich HA-be HUN-ger',ar:'أنا جائع / عطشان',why:'الصياغة الطبيعية بـ "haben". "Ich bin hungrig" تُفهم لكنها أقل طبيعية.',ex:[['Ich habe Hunger. Und du?','أنا جائع. وأنت؟'],['Ich hab Durst.','أنا عطشان.']]},
{c:'F',de:'gell',st:'GELL',ar:'أليس كذلك؟ (جنوب ألمانيا)',why:'ذيل سؤال من الجنوب، يقابل "ne" في الشمال و"oder" عموماً.',ex:[['Schön hier, gell?','جميل هنا، أليس كذلك؟'],['Du kommst auch, gell?','ستأتي أنت أيضاً، أليس كذلك؟']]},
{c:'F',de:'ey',st:'EY',ar:'هيه / يا',why:'نداء أو اعتراض قصير بين الشباب، وقد يعبّر عن غضب أو دهشة.',ex:[['Ey, pass auf!','هيه، انتبه!'],['Ey, das ist nicht cool.','هيه، هذا ليس لطيفاً.']]},
{c:'F',de:'so (Füllwort)',st:'SO',ar:'حسناً / إذن (لبدء خطوة جديدة)',why:'تُقال عند الانتقال لخطوة جديدة أو لتجميع الأفكار قبل الكلام.',ex:[['So, jetzt geht\'s los.','حسناً، لننطلق الآن.'],['So, das wär\'s für heute.','حسناً، هذا كل شيء لليوم.']]},
{c:'S',de:'Der Zug hat Verspätung',st:'der ZUG hat ver-SPÄ-tung',ar:'القطار متأخر',why:'عبارة يومية جداً في ألمانيا، فتأخر القطارات موضوع حديث دائم.',ex:[['Der Zug hat mal wieder Verspätung.','القطار متأخر مجدداً.'],['Wie viel Verspätung denn?','كم التأخير يا ترى؟']]},
{c:'S',de:'Ich bin gleich da',st:'ich bin GLEICH DA',ar:'سأصل حالاً',why:'تطمين سريع لمن ينتظرك، وتُقال حتى لو بقيت دقائق.',ex:[['Wo bist du? – Ich bin gleich da.','أين أنت؟ – سأصل حالاً.'],['Bin gleich da, fang schon mal an.','سأصل حالاً، ابدأ أنت.']]},

{c:'R',de:'Ich bin total fertig',st:'ich bin to-TAL FER-tig',ar:'أنا منهار تماماً',why:'تعبير عن إنهاك شديد جسدياً أو نفسياً، وليس عن إنهاء عمل.',ex:[['Nach dem Tag bin ich total fertig.','بعد هذا اليوم أنا منهار تماماً.'],['Ich bin echt fertig mit den Nerven.','أعصابي منهكة تماماً.']]},
{c:'R',de:'Mach dir keinen Kopf',st:'mach dir KEI-nen KOPF',ar:'لا تشغل بالك',why:'تطمين ودّي لمن يقلق، وتُقال بين الأصدقاء.',ex:[['Mach dir keinen Kopf, das wird schon.','لا تشغل بالك، سيكون كل شيء بخير.'],['Mach dir deswegen keinen Kopf.','لا تشغل بالك بسبب ذلك.']]},
{c:'R',de:'Kopf hoch!',st:'KOPF HOCH',ar:'ارفع رأسك! / تشجّع!',why:'تشجيع لمن حزن أو فشل، وتُقال بنبرة دافئة.',ex:[['Kopf hoch, das wird wieder!','ارفع رأسك، سيتحسن الأمر!'],['Kopf hoch, du schaffst das.','تشجّع، أنت قادر على ذلك.']]},
{c:'A',de:'Das kann ich verstehen',st:'das kann ich ver-STE-hen',ar:'أستطيع أن أفهمك',why:'تُظهر بها تعاطفك دون أن تقدّم نصيحة.',ex:[['Das kann ich gut verstehen.','أستطيع أن أفهم ذلك جيداً.'],['Ja, das ist echt blöd gelaufen.','نعم، ما حدث مزعج حقاً.']]},
{c:'X',de:'Mir geht\'s gut (nicht: ich bin gut)',st:'mir GEHT\'S gut',ar:'أنا بخير',why:'للحال نقول "es geht mir gut". أما "ich bin gut" فتعني أنك جيد في شيء ما.',ex:[['Wie geht\'s dir? – Mir geht\'s gut.','كيف حالك؟ – أنا بخير.'],['Ich bin gut in Mathe.','أنا جيد في الرياضيات.']]},
{c:'P',de:'ist → is · das ist → das is',st:'IS · das IS',ar:'تُحذف "t" الأخيرة في الكلام السريع',why:'اختصار طبيعي جداً في الكلام العفوي، لكن الكتابة تبقى "ist".',ex:[['Das is nich schlimm.','هذا ليس سيئاً.'],['Wie spät is es?','كم الساعة؟']]},
{c:'S',de:'Wie geht\'s der Familie?',st:'wie GEHT\'S der fa-MI-lie',ar:'كيف حال العائلة؟',why:'سؤال ودّي بعد التحية، يُظهر اهتمامك بالطرف الآخر.',ex:[['Wie geht\'s der Familie? – Allen gut, danke.','كيف حال العائلة؟ – الجميع بخير، شكراً.'],['Und wie geht\'s deinen Eltern?','وكيف حال والديك؟']]},
{c:'S',de:'Lange nicht gesehen!',st:'LAN-ge nicht ge-SE-hen',ar:'مدة طويلة لم نلتقِ!',why:'تحية دافئة عند لقاء صديق بعد غياب.',ex:[['Hey, lange nicht gesehen!','مرحباً، مدة طويلة لم نلتقِ!'],['Stimmt, wie geht\'s dir?','صحيح، كيف حالك؟']]},
{c:'S',de:'Was machst du so?',st:'was MACHST du so',ar:'ماذا تفعل هذه الأيام؟',why:'سؤال عفوي بين الأصدقاء عن الجديد في حياتهم.',ex:[['Und, was machst du so?','وأنت، ماذا تفعل هذه الأيام؟'],['Ich arbeite jetzt in Köln.','أعمل الآن في كولن.']]},
{c:'S',de:'Wollen wir uns treffen?',st:'WOL-len wir uns TREF-fen',ar:'هل نلتقي؟',why:'دعوة عفوية للقاء، وتُكمَّل عادة باقتراح وقت.',ex:[['Wollen wir uns am Wochenende treffen?','هل نلتقي في عطلة نهاية الأسبوع؟'],['Gern, Samstag passt mir.','بكل سرور، السبت يناسبني.']]},
{c:'S',de:'Ich bin dabei',st:'ich bin da-BEI',ar:'أنا معكم / موافق',why:'للموافقة على خطة أو دعوة جماعية.',ex:[['Wir gehen grillen. – Ich bin dabei!','سنشوي في الخارج. – أنا معكم!'],['Wer ist dabei?','من سيشارك؟']]},
{c:'S',de:'Ich bin raus',st:'ich bin RAUS',ar:'أنا أنسحب / لن أشارك',why:'تعني الانسحاب من خطة أو لعبة، وتُقال بنبرة حاسمة وغير رسمية.',ex:[['Das ist mir zu teuer, ich bin raus.','هذا غالٍ عليّ، أنا أنسحب.'],['Okay, dann bin ich raus.','حسناً، إذن أنا أنسحب.']]},
{c:'S',de:'Ich geb einen aus',st:'ich GEB EI-nen AUS',ar:'عليّ الحساب / أنا أدعوكم',why:'تُقال عندما تدفع لمجموعة، وغالباً مشروباً أو جولة.',ex:[['Heute geb ich einen aus!','اليوم الحساب عليّ!'],['Danke, das ist nett von dir.','شكراً، هذا لطف منك.']]},
{c:'S',de:'Ich bin kein großer Fan von…',st:'ich bin kein GRO-ßer FAN von',ar:'لست من محبي… كثيراً',why:'طريقة مهذبة لقول إنك لا تحب شيئاً دون أن تبدو حاداً.',ex:[['Ich bin kein großer Fan von Fastfood.','لست من محبي الوجبات السريعة كثيراً.'],['Echt? Ich esse das gern.','حقاً؟ أنا أحبها.']]},
{c:'R',de:'Geschmackssache',st:'ge-SCHMACKS-sa-che',ar:'مسألة ذوق',why:'تُقال عندما تختلف الأذواق ولا يوجد صواب أو خطأ.',ex:[['Magst du Oliven? – Geschmackssache.','هل تحب الزيتون؟ – مسألة ذوق.'],['Ob das gut ist, ist Geschmackssache.','كون هذا جيداً مسألة ذوق.']]},
{c:'S',de:'Ich bin pleite',st:'ich bin PLEI-te',ar:'أنا مفلس',why:'عامية لقلة المال مؤقتاً، وتُقال غالباً قبل نهاية الشهر.',ex:[['Ich bin gerade total pleite.','أنا مفلس تماماً الآن.'],['Pleite? Dann lad ich dich ein.','مفلس؟ إذن أنا أدعوك.']]},
{c:'S',de:'Ich hab kein Netz',st:'ich hab kein NETZ',ar:'ليس لدي شبكة',why:'تُقال عندما تضعف إشارة الهاتف، وكثيراً ما تحدث في القطارات.',ex:[['Ich hab hier kein Netz.','ليس لدي شبكة هنا.'],['Probier mal das WLAN.','جرّب الواي فاي.']]},
{c:'S',de:'Schreib mir kurz',st:'SCHREIB mir KURZ',ar:'راسلني بسرعة',why:'طلب ودّي لرسالة قصيرة، ويُقال عادة قبل لقاء أو وصول.',ex:[['Schreib mir kurz, wenn du da bist.','راسلني بسرعة عندما تصل.'],['Mach ich, bis gleich!','حاضر، إلى بعد قليل!']]},
{c:'J',de:'ghosten',st:'GHOS-ten',ar:'قطع التواصل فجأة دون تفسير',why:'فعل مأخوذ من الإنجليزية، ويُستعمل عن علاقة أو صداقة تنتهي بالصمت.',ex:[['Er hat mich geghostet.','قطع التواصل معي فجأة.'],['Ghosting finde ich unfair.','أجد هذا الأسلوب غير عادل.']]},
{c:'J',de:'random',st:'REN-dom',ar:'عشوائي / غريب',why:'تصف شيئاً غير متوقع أو لا رابط له، وتأتي من الإنجليزية.',ex:[['Das war echt random.','كان ذلك عشوائياً حقاً.'],['Random, aber lustig.','عشوائي لكنه ممتع.']]},
{c:'J',de:'Wallah',st:'WAL-la',ar:'والله (للتأكيد)',why:'دخلت من العربية إلى لغة الشباب في ألمانيا، وتُستعمل للتأكيد أو للدهشة.',ex:[['Wallah, das stimmt!','والله هذا صحيح!'],['Ich schwör, wallah!','أقسم، والله!']]},
{c:'R',de:'Übung macht den Meister',st:'Ü-bung MACHT den MEIS-ter',ar:'التكرار يعلّم الشطار',why:'مثل شائع للتشجيع على المواظبة عند تعلم شيء جديد.',ex:[['Übung macht den Meister, bleib dran!','التكرار يعلّم الشطار، واصل!'],['Na ja, Übung macht den Meister.','حسناً، التكرار يصنع الإتقان.']]},
{c:'R',de:'Aller Anfang ist schwer',st:'AL-ler AN-fang ist SCHWER',ar:'كل بداية صعبة',why:'تُقال لمن يبدأ شيئاً جديداً، فتخفف عنه الإحباط.',ex:[['Aller Anfang ist schwer.','كل بداية صعبة.'],['Keine Sorge, das wird besser.','لا تقلق، سيتحسن الأمر.']]},
{c:'R',de:'Ende gut, alles gut',st:'EN-de GUT, AL-les GUT',ar:'المهم أن النهاية جيدة',why:'تُقال بعد موقف مقلق انتهى بخير.',ex:[['Der Zug kam noch. Ende gut, alles gut!','وصل القطار في النهاية. النهاية جيدة!'],['Na ja, Ende gut, alles gut.','حسناً، المهم أن النهاية جيدة.']]},
{c:'R',de:'Morgen ist auch noch ein Tag',st:'MOR-gen ist auch noch ein TAG',ar:'غداً يوم آخر',why:'تُقال لتأجيل العمل أو للتخفيف بعد يوم متعب.',ex:[['Morgen ist auch noch ein Tag.','غداً يوم آخر.'],['Du hast recht, Feierabend!','معك حق، انتهى العمل!']]},
{c:'R',de:'Das Leben ist kein Ponyhof',st:'das LE-ben ist kein PO-ny-hof',ar:'الحياة ليست سهلة',why:'جملة ساخرة تُقال عند الشكوى من الصعوبات.',ex:[['Das Leben ist kein Ponyhof.','الحياة ليست سهلة.'],['Tja, so ist das eben.','حسناً، هذه هي الحال.']]},
{c:'R',de:'Toi, toi, toi!',st:'TOI, toi, toi',ar:'بالتوفيق (قبل الأداء)',why:'تُقال قبل امتحان أو عرض أو مقابلة، وغالباً مع دقّ الخشب.',ex:[['Gleich ist die Prüfung. – Toi, toi, toi!','بعد قليل الامتحان. – بالتوفيق!'],['Toi, toi, toi für heute Abend!','بالتوفيق الليلة!']]},
{c:'R',de:'Das ist ein Kinderspiel',st:'das ist ein KIN-der-spiel',ar:'هذا سهل جداً',why:'تصف مهمة بسيطة جداً، وحرفياً: لعبة أطفال.',ex:[['Die Aufgabe? Ein Kinderspiel!','المهمة؟ سهلة جداً!'],['Für dich ist das ein Kinderspiel.','بالنسبة لك هذا سهل جداً.']]},
{c:'R',de:'Alles halb so wild',st:'AL-les HALB so WILD',ar:'ليس الأمر خطيراً',why:'تطمين ودّي بعد خطأ صغير أو موقف مقلق.',ex:[['Alles halb so wild, keine Sorge.','ليس الأمر خطيراً، لا تقلق.'],['Ist halb so wild.','الأمر ليس خطيراً.']]},
{c:'A',de:'Kurz gesagt',st:'KURZ ge-SAGT',ar:'باختصار',why:'تلخّص بها كلاماً طويلاً قبل أن تصل إلى النتيجة.',ex:[['Kurz gesagt: Es hat geklappt.','باختصار: نجح الأمر.'],['Kurz gesagt, ich bin raus.','باختصار، أنا انسحبت.']]},
{c:'A',de:'Wie gesagt',st:'wie ge-SAGT',ar:'كما قلت',why:'تُذكّر بها بشيء قلته من قبل، وقد تحمل نبرة صبر خفيفة.',ex:[['Wie gesagt, ich komm später.','كما قلت، سآتي لاحقاً.'],['Wie gesagt, das ist kein Problem.','كما قلت، هذه ليست مشكلة.']]},
{c:'F',de:'mal eben',st:'mal E-ben',ar:'بسرعة / على عجل',why:'تدل على أن الأمر بسيط وسريع، وتُخفف من حجم الطلب.',ex:[['Ich geh mal eben zum Bäcker.','سأذهب بسرعة إلى المخبز.'],['Kannst du mal eben helfen?','هل تساعدني بسرعة؟']]},
{c:'P',de:'kannst du → kannste · weißt du → weißte',st:'KANN-ste · WEISS-te',ar:'"du" تلتصق بالفعل في الكلام السريع',why:'اندماج شائع في الكلام العفوي، تماماً كما في "haste".',ex:[['Kannste mir helfen?','هل تستطيع مساعدتي؟'],['Weißte was? Lass uns gehen.','أتعرف ماذا؟ لنذهب.']]},
{c:'M',de:'Prost! / Zum Wohl!',st:'PROST / zum WOHL',ar:'في صحتك!',why:'تُقال عند رفع الكؤوس، وتُقال أيضاً مع العصير أو الماء.',ex:[['Prost! Auf dich!','في صحتك! لك!'],['Zum Wohl!','بصحتكم!']]}
];
const C=[['all','Alle · الكل'],['F','Füllwörter'],['R','Redewendungen'],['A','Alltagsfloskeln'],['P','Aussprache'],['J','Jugendsprache'],['S','Alltag · يومي'],['M','Restaurant · مطعم'],['W','Arbeit · عمل'],['L','Dialekte · لهجات'],['X','Fehler · أخطاء'],['fav','⭐ Favoriten']];
let cat='all',q='',fav=[],lim=30;
try{fav=JSON.parse(localStorage.getItem('fav')||'[]')}catch(e){}
const $=s=>document.querySelector(s);
function save(){try{localStorage.setItem('fav',JSON.stringify(fav))}catch(e){}}
function chips(){$('#cats').innerHTML=C.map(([k,l])=>`<button data-c="${k}" class="whitespace-nowrap px-3 py-1.5 rounded-full text-sm font-semibold ${cat===k?'bg-indigo-600 text-white':'bg-slate-200 dark:bg-slate-800'}">${l}</button>`).join('')}
function stress(s){return s.split(/([A-ZÄÖÜ]{2,})/).map(p=>/^[A-ZÄÖÜ]{2,}$/.test(p)?`<b class="text-indigo-600 dark:text-indigo-400">${p}</b>`:p).join('')}
function render(){
  const t=q.trim().toLowerCase();
  const r=D.map((d,i)=>({...d,i})).filter(d=>(cat==='all'||(cat==='fav'?fav.includes(d.i):d.c===cat))&&(!t||(d.de+d.ar+d.why+d.ex.flat().join(' ')).toLowerCase().includes(t)));
  $('#empty').classList.toggle('hidden',r.length>0);$('#more').classList.toggle('hidden',r.length<=lim);$('#more').textContent='Mehr anzeigen · المزيد ('+(r.length-lim)+')';
  $('#list').innerHTML=r.slice(0,lim).map(d=>`<article class="card rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 shadow-sm">
    <div class="flex items-start justify-between gap-3">
      <div><h2 class="text-xl font-extrabold">${d.de}</h2><p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">${stress(d.st)}</p></div>
      <div class="flex gap-1 shrink-0"><button data-s="${d.i}" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800" aria-label="Vorlesen">🔊</button><button data-f="${d.i}" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800" aria-label="Favorit">${fav.includes(d.i)?'⭐':'☆'}</button></div>
    </div>
    <p class="ar text-lg font-semibold mt-3 text-indigo-700 dark:text-indigo-300">${d.ar}</p>
    <p class="ar text-[15px] mt-2 text-slate-600 dark:text-slate-300 leading-7">${d.why}</p>
    <div class="mt-4 space-y-3">${d.ex.map(e=>`<div class="rounded-xl bg-slate-50 dark:bg-slate-800/60 p-3"><p class="font-medium">${e[0]}</p><p class="ar text-sm text-slate-500 dark:text-slate-400 mt-1">${e[1]}</p></div>`).join('')}</div>
  </article>`).join('');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='more'){lim+=30;render()}
  else if(b.dataset.c){cat=b.dataset.c;lim=30;chips();render()}
  else if(b.dataset.f!==undefined){const i=+b.dataset.f;fav=fav.includes(i)?fav.filter(x=>x!==i):[...fav,i];save();render()}
  else if(b.dataset.s!==undefined){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(D[+b.dataset.s].de.split(/[→·/]/).pop().replace(/\(.*?\)/g,'').replace(/…/g,'').trim());u.lang='de-DE';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}
});
$('#q').addEventListener('input',e=>{q=e.target.value;lim=30;render()});
function theme(dark){document.documentElement.classList.toggle('dark',dark);$('#theme').textContent=dark?'☀️':'🌙';try{localStorage.setItem('dark',dark?'1':'0')}catch(e){}}
$('#theme').onclick=()=>theme(!document.documentElement.classList.contains('dark'));
let sd=null;try{sd=localStorage.getItem('dark')}catch(e){}
theme(sd?sd==='1':matchMedia('(prefers-color-scheme: dark)').matches);
chips();render();
</script>
</body>
</html>
